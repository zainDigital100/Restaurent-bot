<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineBot Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 120px); }
        .message-bubble { max-width: 80%; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center">

    <div class="w-full max-w-2xl bg-white shadow-xl h-screen flex flex-col">
        <!-- Header -->
        <div class="p-4 bg-orange-600 text-white font-bold text-xl shadow-md">
            Restaurant Assistant
        </div>

        <!-- Chat Area -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="text-gray-500 text-center text-sm">Welcome! How can I help you today?</div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="user-input" placeholder="Ask about menu, delivery..." 
                       class="flex-1 border rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
                <button type="submit" class="bg-orange-600 text-white px-6 py-2 rounded-full hover:bg-orange-700">Send</button>
            </form>
        </div>
    </div>

    <script>
        // REPLACE THIS with your actual deployed FastAPI URL
        const API_URL = "https://restaurent-bot.vercel.app";
        let sessionId = localStorage.getItem('sessionId') || null;

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="message-bubble px-4 py-2 rounded-2xl ${sender === 'user' ? 'bg-orange-600 text-white' : 'bg-gray-200 text-gray-800'}">
                    ${text}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message })
                });

                const data = await response.json();
                sessionId = data.session_id;
                localStorage.setItem('sessionId', sessionId);
                
                addMessage(data.reply, 'bot');
            } catch (err) {
                addMessage("Sorry, I'm having trouble connecting to the server.", 'bot');
            }
        });
    </script>
</body>
</html>
